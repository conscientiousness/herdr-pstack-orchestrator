name: Package validation

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Python syntax and CLI entry points
        run: |
          python -m compileall -q skills e2e scripts
          python skills/herdr-orchestrator/scripts/horch.py --help
          python scripts/prepare_pstack.py --help
          python scripts/check_upstream.py --help
          python e2e/review_loop.py --help
          python e2e/pi_startup.py --help
          python e2e/pi_preflight.py --help
          python e2e/controller_loop.py --help
          python e2e/caller_context.py --help
          python e2e/skill_catalogs.py --help
      - name: Parse example configuration
        run: |
          python - <<'PY'
          import pathlib, tomllib
          path = pathlib.Path('skills/herdr-orchestrator/references/workers.example.toml')
          tomllib.loads(path.read_text())
          PY
      - name: Install the bundled skills into a disposable project
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          package_check=$(mktemp -d)
          cd "$package_check"
          npx --yes skills@1.7.1 add "$GITHUB_WORKSPACE/skills" -s '*' -a claude-code -a codex -a pi -y
          python "$GITHUB_WORKSPACE/e2e/skill_catalogs.py" "$package_check" --installation-only
          python .agents/skills/herdr-orchestrator/scripts/horch.py --help
          test ! -e .agents/skills/herdr-orchestrator/scripts/e2e.py
          test ! -e .agents/skills/herdr-orchestrator/e2e
          test ! -e .agents/skills/herdr-orchestrator/references/verification.json
          test ! -e .agents/skills/herdr-orchestrator/references/review-e2e.json
          test -f .agents/skills/herdr-orchestrator/references/workers.example.toml
          test -f .agents/skills/herdr-orchestrator/references/setup.md
          test -f .agents/skills/herdr-orchestrator/references/lifecycle.md
          test -f .agents/skills/pstack-herdr/references/compatibility.md
          test -f .agents/skills/pstack-herdr/references/herdr-tools.md
          test -f .claude/skills/herdr-orchestrator/SKILL.md
      - name: Verify bundled upstream files match regeneration
        if: matrix.python == '3.11'
        env:
          DISABLE_TELEMETRY: '1'
        run: |
          catalog_check=$(mktemp -d)
          pstack_revision=$(python -c 'import json; print(json.load(open("skills/pstack-herdr/references/upstream.json"))["revision"])')
          git clone --quiet https://github.com/cursor/plugins.git "$catalog_check/source"
          git -C "$catalog_check/source" checkout --detach "$pstack_revision"
          python scripts/prepare_pstack.py --source "$catalog_check/source" --output "$catalog_check/package"
          diff -r --exclude=__pycache__ skills "$catalog_check/package/skills"
